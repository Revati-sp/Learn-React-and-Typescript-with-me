<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TypeScript Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="calculator">
    <div class="screen">
      <div id="history"></div>
      <div id="display">0</div>
    </div>

    <!-- data-value tells our TypeScript code what each button means -->
    <div class="buttons">
      <button data-value="C" class="fn">C</button>
      <button data-value="DEL" class="fn">⌫</button>
      <button data-value="/" class="op">÷</button>
      <button data-value="*" class="op">×</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button data-value="-" class="op">−</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button data-value="+" class="op">+</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button data-value="=" class="eq">=</button>

      <button data-value="0" class="zero">0</button>
      <button data-value=".">.</button>
    </div>
  </div>

  <!-- The browser runs the COMPILED JavaScript, not the .ts file -->
  <script src="calculator.js"></script>
</body>
</html>
